[project]
name = "simple-agent-sandbox"
version = "0.3.0"
description = "Sandbox environment for multiple AI agents with config-driven installation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "AlexAndrewsAI", email = "alex.andrews.ai@protonmail.com"}
]
keywords = ["sandbox", "docker", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pip-audit",
    "prek>=0.4.8",
    "pymarkdownlnt",
    "shellcheck-py>=0.11.0.1",
]

[project.urls]
Homepage = "https://github.com/AlexAndrewsAI/simple-agent-sandbox"
Repository = "https://github.com/AlexAndrewsAI/simple-agent-sandbox.git"
Documentation = "https://github.com/AlexAndrewsAI/simple-agent-sandbox#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_agent_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
