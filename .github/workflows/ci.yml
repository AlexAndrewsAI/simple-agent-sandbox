name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pre-commit hooks
        run: uv run prek run --all-files

  validate-config:
    name: Validate config.example.yml
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      - name: Lint config.example.yml
        run: |
          echo "Checking YAML syntax..."
          yq '.' config.example.yml > /dev/null

          echo "Checking apt list is non-empty..."
          apt_count=$(yq -r '.apt | length' config.example.yml)
          if [ "$apt_count" -eq 0 ]; then
            echo "ERROR: no apt packages found" >&2
            exit 1
          fi
          echo "Apt packages: $apt_count"

          echo "Checking install keys are non-empty..."
          count=$(yq -r '.install | length' config.example.yml)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no install entries found" >&2
            exit 1
          fi
          echo "Install entries: $count"
          for i in $(seq 0 $((count - 1))); do
            key=$(yq -r ".install | keys[$i]" config.example.yml)
            cmd=$(yq -r ".install.$key" config.example.yml)
            if [ -z "$cmd" ] || [ "$cmd" = "null" ]; then
              echo "ERROR: empty command for $key" >&2
              exit 1
            fi
            echo "  $key: OK"
          done

  validate-installer:
    name: Validate installer.sh (dry-run)
    runs-on: ubuntu-latest
    needs: [pre-commit, validate-config]
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      - name: Syntax check installer.sh
        run: bash -n scripts/installer.sh

      - name: Copy example configs
        run: |
          cp config.example.yml config.yml

      - name: Dry-run installer against config.example.yml
        run: |
          # Copy config.yml to /tmp/config.yml (as Dockerfile does)
          cp config.yml /tmp/config.yml
          # Replace all install commands with 'true' so we validate parsing
          # and control flow without actually installing anything.
          yq '.install | with_entries(.value = "true")' /tmp/config.yml > /tmp/config_test.yml
          mv /tmp/config_test.yml /tmp/config.yml
          bash -x scripts/installer.sh

      - name: Test command validation
        run: |
          # Test that validation blocks malicious commands
          if bash -c 'source scripts/installer.sh && validate_command "rm -rf / && echo hacked"'; then
            echo "ERROR: Validation failed to block malicious command"
            exit 1
          fi
          echo "Validation correctly blocked malicious command"

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: validate-installer
    steps:
      - uses: actions/checkout@v4

      - name: Copy example configs
        run: |
          cp config.example.yml config.yml
          cp docker-compose.example.yml docker-compose.yml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build sandbox image
        run: |
          docker compose build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            --progress=plain
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
