name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pre-commit hooks
        run: uv run prek run --all-files

  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

      - name: Security audit with pip-audit
        run: uv run pip-audit

      - name: Check changelog updated
        if: github.event_name == 'pull_request'
        run: |
          if git diff origin/main...HEAD --name-only | grep -q CHANGELOG.md; then
            echo "CHANGELOG.md has been updated."
          else
            echo "::error::CHANGELOG.md has not been updated for this branch."
            echo "Please add your changes to CHANGELOG.md under the section '[version] - date - PR' before merging."
            exit 1
          fi

  validate-config:
    name: Validate config.example.yml
    runs-on: ubuntu-latest
    needs: [pre-commit, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      - name: Lint config.example.yml
        run: |
          echo "Checking YAML syntax..."
          yq '.' config.example.yml > /dev/null

          echo "Checking apt list is non-empty..."
          apt_count=$(yq -r '.apt | length' config.example.yml)
          if [ "$apt_count" -eq 0 ]; then
            echo "ERROR: no apt packages found" >&2
            exit 1
          fi
          echo "Apt packages: $apt_count"

          echo "Checking install keys are non-empty..."
          count=$(yq -r '.install | length' config.example.yml)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no install entries found" >&2
            exit 1
          fi
          echo "Install entries: $count"
          for i in $(seq 0 $((count - 1))); do
            key=$(yq -r ".install | keys[$i]" config.example.yml)
            cmd=$(yq -r ".install.$key" config.example.yml)
            if [ -z "$cmd" ] || [ "$cmd" = "null" ]; then
              echo "ERROR: empty command for $key" >&2
              exit 1
            fi
            echo "  $key: OK"
          done

  validate-installer:
    name: Validate installer.sh (dry-run)
    runs-on: ubuntu-latest
    needs: [pre-commit, validate-config]
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      - name: Syntax check installer.sh
        run: bash -n scripts/installer.sh

      - name: Copy example configs
        run: |
          cp config.example.yml config.yml

      - name: Dry-run installer against config.example.yml
        run: |
          # Copy config.yml to /tmp/config.yml (as Dockerfile does)
          cp config.yml /tmp/config.yml
          # Replace all install commands with 'true' so we validate parsing
          # and control flow without actually installing anything.
          yq '.install | with_entries(.value = "true")' /tmp/config.yml > /tmp/config_test.yml
          mv /tmp/config_test.yml /tmp/config.yml
          bash -x scripts/installer.sh

      - name: Test command validation
        run: |
          # Test that validate_command exists and rejects malicious commands
          # First verify the function is available
          bash -c 'source scripts/installer.sh && type validate_command'

          # Capture output and exit code separately
          output=$(bash -c 'source scripts/installer.sh && validate_command "rm -rf / && echo hacked"' 2>&1)
          exit_code=$?

          # Must fail (non-zero exit)
          if [[ $exit_code -eq 0 ]]; then
            echo "ERROR: validate_command unexpectedly succeeded for malicious input"
            exit 1
          fi

          # Must have the expected error message
          if [[ "$output" != *"ERROR: Command does not match safe patterns"* ]]; then
            echo "ERROR: validate_command failed but with unexpected message"
            echo "Expected: 'ERROR: Command does not match safe patterns'"
            echo "Got: $output"
            exit 1
          fi

          echo "Validation correctly blocked malicious command (exit=$exit_code)"

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: validate-installer
    steps:
      - uses: actions/checkout@v4

      - name: Copy example configs
        run: |
          cp config.example.yml config.yml
          cp docker-compose.example.yml docker-compose.yml

      - name: Build sandbox image
        run: |
          docker compose build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --progress=plain
